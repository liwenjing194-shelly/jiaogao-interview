<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>进入校稿</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="login-main"><section class="panel login-panel"><div class="eyebrow">校稿 · 面试体验版</div><h1>进入检查工作台</h1><p>请输入演示者提供的访问码。</p><form method="post" action="/login"><label class="field-label" for="code">访问码</label><input id="code" name="code" type="password" required autocomplete="current-password" maxlength="200"><p role="alert">__MESSAGE__</p><button class="primary-button" type="submit">进入工作台 →</button></form><p>提交的文案及图片将发送至阿里云百炼进行检查。请使用自制或可公开的测试材料。</p><p>检查记录仅当前浏览器会话可见，请及时下载报告。</p></section></main></body></html>
